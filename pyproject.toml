[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-mvp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "uvicorn==0.53.0",
  "scikit-learn",
  "rank-bm25",
  "pypdf",
  "python-docx",
  "openpyxl",
  "python-pptx",
  "python-multipart==0.0.32",
  "streamlit==1.65.0",
  "httpx==0.28.1",
  "pyyaml",
  "pytest==9.1.1",
  "sentence-transformers",
  "truststore",
  "sqlite-vec==0.1.6",
  "olefile==0.47",
  "requests",
  "python-dotenv==1.2.4",
  "psycopg[binary]==3.3.6",
  "celery[redis]==5.6.3",
  "pymupdf==1.27.2.2",
  "Pillow==12.1.1",
  "langgraph==1.2.13",
  "prometheus-client==0.26.0",
  "psutil==7.2.2",
]
# torch는 CPU 휠을 vendor/wheels에서 별도 설치 (CUDA 오설치 방지, install-offline.bat 참조)

[tool.setuptools.packages.find]
include = ["app*", "api*", "rag*", "retrieval*", "ingestion*", "database*",
           "models*", "security*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
